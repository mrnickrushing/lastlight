name: Validate Last Light

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The release notes are the merge stream, so the merge stream has to
          # be here. A shallow clone made the generator report every pull
          # request the handoff has ever cited as one git had never seen.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Cache Rokit tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install Rokit
        shell: bash
        run: |
          if [[ ! -x "$HOME/.rokit/bin/rokit" ]]; then
            curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash
          fi
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned Roblox tools
        run: rokit install --no-trust-check

      - name: Validate, test, and build
        run: npm test
